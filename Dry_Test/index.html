<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISION Biometric Verification Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .video-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        #webcam {
            width: 100%;
            max-width: 640px;
            height: 480px;
            border-radius: 10px;
            background: #000;
            display: block;
            margin: 0 auto;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .status {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .status-item {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            font-weight: 500;
        }
        .status-info {
            background: #dbeafe;
            color: #1e40af;
        }
        .status-success {
            background: #d1fae5;
            color: #065f46;
        }
        .status-error {
            background: #fee2e2;
            color: #991b1b;
        }
        .results {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .result-card {
            background: #f3f4f6;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .result-verified {
            border-left-color: #10b981;
            background: #d1fae5;
        }
        .result-denied {
            border-left-color: #ef4444;
            background: #fee2e2;
        }
        pre {
            background: #1f2937;
            color: #d1d5db;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 VISION Biometric Verification Test</h1>
        
        <div class="video-container">
            <video id="webcam" autoplay playsinline></video>
            <div class="controls">
                <button id="startBtn" class="btn-primary">📹 Start Webcam</button>
                <button id="captureBtn" class="btn-success hidden">📸 Capture & Verify</button>
                <button id="stopBtn" class="btn-danger hidden">⏹ Stop</button>
            </div>
        </div>

        <div class="status">
            <h2>Status</h2>
            <div id="statusLog"></div>
        </div>

        <div class="results">
            <h2>Verification Results</h2>
            <div id="resultsContainer">
                <p style="color: #6b7280;">No verifications yet. Capture your face to test!</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8001/api/v1';
        const video = document.getElementById('webcam');
        const startBtn = document.getElementById('startBtn');
        const captureBtn = document.getElementById('captureBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusLog = document.getElementById('statusLog');
        const resultsContainer = document.getElementById('resultsContainer');
        
        let stream = null;
        let verificationResults = [];

        // Utility functions
        function addStatus(message, type = 'info') {
            const statusItem = document.createElement('div');
            statusItem.className = `status-item status-${type}`;
            statusItem.textContent = `${new Date().toLocaleTimeString()} - ${message}`;
            statusLog.insertBefore(statusItem, statusLog.firstChild);
        }

        function saveResultsToFile() {
            const data = {
                test_date: new Date().toISOString(),
                total_verifications: verificationResults.length,
                results: verificationResults
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `verification_results_${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            addStatus('Results saved to JSON file', 'success');
        }

        // Start webcam
        async function startWebcam() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 }
                });
                video.srcObject = stream;
                
                startBtn.classList.add('hidden');
                captureBtn.classList.remove('hidden');
                stopBtn.classList.remove('hidden');
                
                addStatus('Webcam started successfully', 'success');
            } catch (error) {
                addStatus(`Error starting webcam: ${error.message}`, 'error');
                console.error('Webcam error:', error);
            }
        }

        // Stop webcam
        function stopWebcam() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                stream = null;
                
                startBtn.classList.remove('hidden');
                captureBtn.classList.add('hidden');
                stopBtn.classList.add('hidden');
                
                addStatus('Webcam stopped', 'info');
            }
        }

        // Capture frame from video
        function captureFrame() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            return new Promise((resolve) => {
                canvas.toBlob((blob) => {
                    resolve(blob);
                }, 'image/jpeg', 0.8);
            });
        }

        // Verify face against backend
        async function verifyFace() {
            try {
                addStatus('Capturing frame...', 'info');
                const imageBlob = await captureFrame();
                
                addStatus('Sending to backend for 1:N gate identification...', 'info');
                
                const formData = new FormData();
                formData.append('image', imageBlob, 'capture.jpg');
                
                const response = await fetch(`${API_BASE_URL}/biometric/identify`, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                console.log('Identification result:', result);

                const isMatch = response.ok && (result.match_found === true || result.verified === true || result.success === true);
                const matchedUserId = result.best_match_user_id || result.user_id || null;
                const distanceStr = result.distance !== null && result.distance !== undefined ? Number(result.distance).toFixed(4) : 'N/A';
                const thresholdStr = result.threshold !== null && result.threshold !== undefined ? Number(result.threshold).toFixed(4) : '0.60';
                
                if (isMatch && matchedUserId) {
                    const confPercent = result.confidence_score ? (result.confidence_score * 100).toFixed(1) + '%' : '95.0%';
                    addStatus(`✅ Match Found! User: ${matchedUserId} (Distance: ${distanceStr} <= ${thresholdStr})`, 'success');
                    
                    const verificationData = {
                        timestamp: new Date().toISOString(),
                        status: 'verified',
                        user_id: matchedUserId,
                        confidence_score: result.confidence_score || 0.95,
                        distance: result.distance || 0.0,
                        threshold: result.threshold || 0.60,
                        model: result.model || 'VGG-Face'
                    };
                    
                    verificationResults.push(verificationData);
                    displayResult(verificationData);
                } else {
                    const reason = result?.detail?.error?.message || result?.message || (result.distance ? `Distance ${distanceStr} exceeds threshold ${thresholdStr}` : 'No matching user profile found in database');
                    addStatus(`❌ No Match Found: ${reason}`, 'error');
                    
                    const verificationData = {
                        timestamp: new Date().toISOString(),
                        status: 'denied',
                        reason: reason,
                        distance: result.distance,
                        threshold: result.threshold || 0.60
                    };
                    
                    verificationResults.push(verificationData);
                    displayResult(verificationData);
                }
                
                // Auto-save results
                if (verificationResults.length > 0) {
                    saveResultsToFile();
                }
                
            } catch (error) {
                addStatus(`Verification error: ${error.message}`, 'error');
                console.error('Verification error:', error);
            }
        }

        // Display result
        function displayResult(data) {
            if (resultsContainer.querySelector('p')) {
                resultsContainer.innerHTML = '';
            }
            
            const resultCard = document.createElement('div');
            resultCard.className = `result-card result-${data.status === 'verified' ? 'verified' : 'denied'}`;
            
            if (data.status === 'verified') {
                resultCard.innerHTML = `
                    <h3>✅ Verified — Access Granted</h3>
                    <p><strong>User ID:</strong> ${data.user_id}</p>
                    <p><strong>Confidence:</strong> ${(data.confidence_score * 100).toFixed(1)}%</p>
                    <p><strong>Distance:</strong> ${data.distance !== undefined ? Number(data.distance).toFixed(4) : 'N/A'} (Threshold: ${data.threshold})</p>
                    <p><strong>Model:</strong> ${data.model || 'VGG-Face'}</p>
                    <p><strong>Time:</strong> ${new Date(data.timestamp).toLocaleTimeString()}</p>
                `;
            } else {
                resultCard.innerHTML = `
                    <h3>❌ Access Denied — Unrecognized Face</h3>
                    <p><strong>Reason:</strong> ${data.reason}</p>
                    ${data.distance !== null && data.distance !== undefined ? `<p><strong>Distance:</strong> ${Number(data.distance).toFixed(4)} (Threshold: ${data.threshold})</p>` : ''}
                    <p><strong>Time:</strong> ${new Date(data.timestamp).toLocaleTimeString()}</p>
                `;
            }
            
            resultsContainer.insertBefore(resultCard, resultsContainer.firstChild);
        }

        // Event listeners
        startBtn.addEventListener('click', startWebcam);
        stopBtn.addEventListener('click', stopWebcam);
        captureBtn.addEventListener('click', verifyFace);

        // Initialize
        addStatus('Ready to test biometric verification', 'info');
    </script>
</body>
</html>
